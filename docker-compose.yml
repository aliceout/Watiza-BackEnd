services:
  database:
    image: postgres:16
    container_name: watizat-db
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - .env

  cache:
    image: redis:latest
    container_name: watizat-redis
    restart: unless-stopped

  directus:
    image: directus/directus:latest
    container_name: watizat-directus
    restart: unless-stopped
    ports:
      - "8055:8055"
    depends_on:
      - database
      - cache
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
    env_file:
      - .env

  directus-sync:
    image: node:20
    container_name: watizat-directus-sync
    working_dir: /sync
    depends_on:
      - directus
    volumes:
      - ./:/sync
    env_file:
      - .env
    entrypoint: ["sh", "-c"]
    command: >
      npm install &&
      npx directus-sync push
    profiles:
      - sync

volumes:
  db_data:
