version: '3'
services:
  database:
    image: postgres:latest

    volumes:
      - ./data/database:/var/lib/postgresql/data
    restart: always

    environment:
      POSTGRES_USER: 'directus'
      POSTGRES_PASSWORD: 'directus'
      POSTGRES_DB: 'directus'


  cache:
    image: redis:6
    restart: always


  directus:
    image: directus/directus:latest

    ports:
      - 8055:8055

    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions

    depends_on:
      - cache
      - database
    restart: always

    environment:
      KEY: 'Dehydrate7-Thrive-Resident'
      SECRET: 'Ridden0-Unclamped-Cilantro'

      DB_CLIENT: 'pg'
      DB_HOST: 'database'
      DB_PORT: '5432'
      DB_DATABASE: 'directus'
      DB_USER: 'directus'
      DB_PASSWORD: 'directus'

      CACHE_ENABLED: 'true'
      CACHE_STORE: 'redis'
      REDIS: 'redis://cache:6379'

      ADMIN_EMAIL: 'directus.earthling695@slmail.me'
      ADMIN_PASSWORD: 'Saloon-Stand-Unmindful8'

      PUBLIC_URL: 'https://back.watizat.app'

